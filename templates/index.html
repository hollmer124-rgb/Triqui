<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0a">
  <meta name="description" content="Juega Triqui en línea con otra persona.">
  <title>Triqui | Neon Edition</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      background: #090b0a;
      color: #f5fff3;
      --neon: #39ff14;
      --muted: #91a18e;
      --panel: #111512;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 0, rgb(57 255 20 / 10%), transparent 50%),
        #090b0a;
    }

    button, input { font: inherit; }

    .shell { width: min(100%, 560px); }

    .brand {
      margin: 0 0 6px;
      color: var(--neon);
      font-size: clamp(2.2rem, 9vw, 3.8rem);
      letter-spacing: .06em;
      line-height: 1;
      text-align: center;
      text-shadow: 0 0 22px rgb(57 255 20 / 35%);
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: .9rem;
      letter-spacing: .16em;
      text-align: center;
      text-transform: uppercase;
    }

    .panel {
      padding: clamp(20px, 5vw, 32px);
      border: 1px solid rgb(57 255 20 / 28%);
      border-radius: 18px;
      background: linear-gradient(145deg, rgb(20 26 21 / 96%), rgb(12 15 13 / 98%));
      box-shadow: 0 18px 70px rgb(0 0 0 / 42%), 0 0 32px rgb(57 255 20 / 5%);
    }

    .setup-form { display: grid; gap: 20px; }
    .field { display: grid; gap: 8px; }
    .field label, .eyebrow {
      color: var(--neon);
      font-size: 1rem;
      letter-spacing: .05em;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #40513d;
      border-radius: 8px;
      outline: none;
      background: #090c0a;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 1rem;
    }

    .field input:focus { border-color: var(--neon); box-shadow: 0 0 0 3px rgb(57 255 20 / 12%); }

    .primary, .secondary {
      min-height: 48px;
      padding: 10px 18px;
      border: 2px solid var(--neon);
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.05rem;
      letter-spacing: .04em;
      transition: background .15s ease, color .15s ease, transform .15s ease;
    }

    .primary { background: var(--neon); color: #071006; }
    .primary:hover { background: #8dff76; transform: translateY(-1px); }
    .secondary { background: transparent; color: var(--neon); }
    .secondary:hover { background: rgb(57 255 20 / 10%); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .game[hidden], .setup[hidden], .round-actions[hidden] { display: none; }
    .scoreboard {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgb(57 255 20 / 28%);
    }

    .player { min-width: 0; color: var(--muted); text-align: center; }
    .player.active { color: var(--neon); }
    .player-name {
      display: block;
      overflow: hidden;
      font-size: clamp(.9rem, 4vw, 1.2rem);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-mark { display: block; margin-top: 3px; font-size: .8rem; }
    .score {
      color: var(--neon);
      font-size: clamp(1.7rem, 7vw, 2.4rem);
      white-space: nowrap;
      text-shadow: 0 0 16px rgb(57 255 20 / 25%);
    }

    .status {
      min-height: 26px;
      margin: 18px 0;
      color: #e7f2e4;
      font-family: Arial, sans-serif;
      font-size: 1rem;
      text-align: center;
    }

    .board {
      display: grid;
      width: min(100%, 420px);
      aspect-ratio: 1;
      margin: 0 auto;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      overflow: hidden;
      border: 2px solid var(--neon);
      border-radius: 10px;
      box-shadow: 0 0 26px rgb(57 255 20 / 9%);
    }

    .cell {
      display: grid;
      min-width: 0;
      place-items: center;
      border: 1px solid rgb(57 255 20 / 66%);
      background: #0c100d;
      color: var(--neon);
      cursor: pointer;
      font-size: clamp(2.7rem, 15vw, 5rem);
      line-height: 1;
      text-shadow: 0 0 20px rgb(57 255 20 / 35%);
    }

    .cell:hover:enabled { background: #172019; }
    .cell:disabled { cursor: default; }
    .cell.winning { background: rgb(57 255 20 / 15%); }
    .round-actions { display: grid; gap: 10px; margin-top: 22px; }
    .hint {
      margin: 18px 0 0;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: .85rem;
      line-height: 1.5;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <h1 class="brand">THE BEST TRIQUI</h1>
    <p class="subtitle">Neon edition · Dos jugadores</p>

    <section class="panel setup" id="setup">
      <form class="setup-form" id="setup-form">
        <div class="field">
          <label for="player-x">Jugador 1 · X</label>
          <input id="player-x" name="player-x" maxlength="16" value="Jugador 1" autocomplete="off">
        </div>
        <div class="field">
          <label for="player-o">Jugador 2 · O</label>
          <input id="player-o" name="player-o" maxlength="16" value="Jugador 2" autocomplete="off">
        </div>
        <button class="primary" type="submit">Empezar partida</button>
      </form>
      <p class="hint">Cada ronda empieza con un turno aleatorio. Gana quien complete una línea de tres.</p>
    </section>

    <section class="panel game" id="game" aria-label="Partida de Triqui" hidden>
      <div class="scoreboard" aria-label="Marcador">
        <div class="player" id="player-x-display">
          <span class="player-name" id="player-x-name"></span>
          <span class="player-mark">Juega con X</span>
        </div>
        <output class="score" id="score" aria-label="Marcador">0 : 0</output>
        <div class="player" id="player-o-display">
          <span class="player-name" id="player-o-name"></span>
          <span class="player-mark">Juega con O</span>
        </div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="board" id="board" role="group" aria-label="Tablero de 3 por 3">
        <button class="cell" type="button" data-cell="0"></button>
        <button class="cell" type="button" data-cell="1"></button>
        <button class="cell" type="button" data-cell="2"></button>
        <button class="cell" type="button" data-cell="3"></button>
        <button class="cell" type="button" data-cell="4"></button>
        <button class="cell" type="button" data-cell="5"></button>
        <button class="cell" type="button" data-cell="6"></button>
        <button class="cell" type="button" data-cell="7"></button>
        <button class="cell" type="button" data-cell="8"></button>
      </div>
      <div class="round-actions" id="round-actions" hidden>
        <button class="primary" id="play-again" type="button">Jugar otra ronda</button>
        <button class="secondary" id="change-players" type="button">Cambiar jugadores</button>
      </div>
      <p class="hint">El marcador se conserva entre rondas y se reinicia al cambiar los jugadores.</p>
    </section>
  </main>

  <script>
    const setup = document.querySelector("#setup");
    const game = document.querySelector("#game");
    const form = document.querySelector("#setup-form");
    const nameInputs = [document.querySelector("#player-x"), document.querySelector("#player-o")];
    const nameLabels = [document.querySelector("#player-x-name"), document.querySelector("#player-o-name")];
    const playerDisplays = [document.querySelector("#player-x-display"), document.querySelector("#player-o-display")];
    const scoreOutput = document.querySelector("#score");
    const status = document.querySelector("#status");
    const cells = [...document.querySelectorAll("[data-cell]")];
    const roundActions = document.querySelector("#round-actions");
    const scores = [0, 0];
    let names = ["Jugador 1", "Jugador 2"];
    let board = Array(9).fill("");
    let turn = "X";
    let finished = false;
    let winningCells = [];

    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    function startRound() {
      board = Array(9).fill("");
      turn = Math.random() < 0.5 ? "X" : "O";
      finished = false;
      winningCells = [];
      roundActions.hidden = true;
      status.textContent = `Turno de ${names[turn === "X" ? 0 : 1]} (${turn})`;
      render();
    }

    function getWinningLine() {
      return winningLines.find(([a, b, c]) => board[a] && board[a] === board[b] && board[b] === board[c]);
    }

    function render() {
      scoreOutput.textContent = `${scores[0]} : ${scores[1]}`;
      playerDisplays[0].classList.toggle("active", !finished && turn === "X");
      playerDisplays[1].classList.toggle("active", !finished && turn === "O");

      cells.forEach((cell, index) => {
        cell.textContent = board[index];
        cell.disabled = finished || Boolean(board[index]);
        cell.classList.toggle("winning", winningCells.includes(index));
        cell.setAttribute("aria-label", `Casilla ${index + 1}${board[index] ? `, ${board[index]}` : ", vacía"}`);
      });
    }

    function play(index) {
      if (finished || board[index]) return;

      board[index] = turn;
      const line = getWinningLine();

      if (line) {
        finished = true;
        winningCells = line;
        const winnerIndex = turn === "X" ? 0 : 1;
        scores[winnerIndex] += 1;
        status.textContent = `¡Ganó ${names[winnerIndex]} (${turn})!`;
        roundActions.hidden = false;
      } else if (board.every(Boolean)) {
        finished = true;
        status.textContent = "¡Empate!";
        roundActions.hidden = false;
      } else {
        turn = turn === "X" ? "O" : "X";
        status.textContent = `Turno de ${names[turn === "X" ? 0 : 1]} (${turn})`;
      }

      render();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      names = nameInputs.map((input, index) => input.value.trim() || `Jugador ${index + 1}`);
      nameLabels.forEach((label, index) => { label.textContent = names[index]; });
      scores.fill(0);
      setup.hidden = true;
      game.hidden = false;
      startRound();
    });

    cells.forEach((cell) => {
      cell.addEventListener("click", () => play(Number(cell.dataset.cell)));
    });

    document.querySelector("#play-again").addEventListener("click", startRound);
    document.querySelector("#change-players").addEventListener("click", () => {
      game.hidden = true;
      setup.hidden = false;
      nameInputs[0].focus();
    });
  </script>
</body>
</html>
